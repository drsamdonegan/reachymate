version: "3.9"

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: simulation
      LOG_LEVEL: INFO
      DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/reachy_bouncer
      REACHY_SIMULATION: "true"
      REACHY_ENABLED: "false"
      PHYSICAL_UNLOCK_ENABLED: "false"
      ALLOW_DEV_ENDPOINTS: "false"
      MLAI_BACKEND_URL: http://mock-mlai-backend:8091
      MLAI_BACKEND_API_KEY: local-dev-key
    depends_on:
      - postgres
      - mock-mlai-backend
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reachy_bouncer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  mock-mlai-backend:
    build: .
    command: ["uvicorn", "app.scripts.mock_mlai_backend:app", "--host", "0.0.0.0", "--port", "8091"]
