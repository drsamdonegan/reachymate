name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --extra audio --extra vision --extra skills
      - name: Lint
        run: uv run ruff check app
      - name: Test canonical runtime
        run: uv run pytest app/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dashboard camera sharing
        run: node --test app/tests/js/*.test.cjs
      - name: Verify wheel builds
        run: uv build

  macos-sdk-contracts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full locked SDK test environment
        run: uv sync --frozen --extra dev --extra audio --extra vision --extra reachy --extra skills
      - name: Verify SDK and canonical runtime without hardware
        run: uv run pytest app/tests -q
