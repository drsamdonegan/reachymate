[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-office-bouncer"
version = "0.1.0"
description = "Production-oriented office access controller for Reachy Mini Lite."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
audio = [
  "onnxruntime>=1.20.0",
  "openwakeword>=0.6.0",
  "silero-vad>=5.1.2",
  "sounddevice>=0.5.1",
  "vosk>=0.3.45",
]
vision = [
  "opencv-python>=4.10.0.84",
]
reachy = [
  "eclipse-zenoh~=1.7.0",
  "reachy-mini>=1.2.3rc1",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
reachy-office-bouncer = "app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = [
  "static/*",
  "storage/migrations/*",
  "storage/migrations/versions/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 110
exclude = [".venv", "dist", "build", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
strict = false
